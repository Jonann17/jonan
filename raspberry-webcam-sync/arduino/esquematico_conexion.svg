<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="1100" height="720" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Pi A  ↔  Arduino UNO  ↔  Piranómetro casero</text>
  <text x="550" y="56" text-anchor="middle" font-size="13" fill="#666">UART 9600 baudios por GPIO con conversor de nivel 3,3 V ↔ 5 V · celda solar con resistencia en serie hacia A0</text>

  <!-- ===== Raspberry Pi 1 ===== -->
  <rect x="30" y="90" width="270" height="400" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="165" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e7d32">Pi A (cámara + servidor)</text>
  <text x="165" y="138" text-anchor="middle" font-size="12" fill="#555">camara/camara.py · /dev/serial0</text>
  <g font-size="13">
    <rect x="200" y="165" width="100" height="26" fill="#fff" stroke="#2e7d32"/><text x="250" y="183" text-anchor="middle">pin 1 · 3V3</text>
    <rect x="200" y="215" width="100" height="26" fill="#fff" stroke="#2e7d32"/><text x="250" y="233" text-anchor="middle">pin 2 · 5V</text>
    <rect x="200" y="265" width="100" height="26" fill="#fff" stroke="#2e7d32"/><text x="250" y="283" text-anchor="middle">pin 6 · GND</text>
    <rect x="200" y="315" width="100" height="26" fill="#fff" stroke="#2e7d32"/><text x="250" y="333" text-anchor="middle">pin 8 · TXD</text>
    <rect x="200" y="365" width="100" height="26" fill="#fff" stroke="#2e7d32"/><text x="250" y="383" text-anchor="middle">pin 10 · RXD</text>
  </g>
  <text x="45" y="333" font-size="12" fill="#555">GPIO14</text>
  <text x="45" y="383" font-size="12" fill="#555">GPIO15</text>
  <rect x="50" y="420" width="230" height="50" rx="6" fill="#fff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="165" y="441" text-anchor="middle" font-size="12">USB ← Webcam</text>
  <text x="165" y="459" text-anchor="middle" font-size="12">Hotspot "FotosPi" → Pi B (IHM)</text>

  <!-- ===== Conversor de nivel ===== -->
  <rect x="420" y="150" width="200" height="260" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="520" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565c0">Conversor de nivel</text>
  <text x="520" y="194" text-anchor="middle" font-size="11" fill="#555">bidireccional (BSS138, 4 canales)</text>
  <g font-size="13">
    <text x="432" y="233">LV</text><text x="608" y="233" text-anchor="end">HV</text>
    <text x="432" y="283">GND</text><text x="608" y="283" text-anchor="end">GND</text>
    <text x="432" y="333">LV1</text><text x="608" y="333" text-anchor="end">HV1</text>
    <text x="432" y="383">LV2</text><text x="608" y="383" text-anchor="end">HV2</text>
  </g>

  <!-- ===== Arduino ===== -->
  <rect x="740" y="90" width="270" height="400" rx="10" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
  <text x="875" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#00838f">Arduino UNO</text>
  <text x="875" y="138" text-anchor="middle" font-size="12" fill="#555">piranometro.ino</text>
  <g font-size="13">
    <rect x="740" y="215" width="100" height="26" fill="#fff" stroke="#00838f"/><text x="790" y="233" text-anchor="middle">5V</text>
    <rect x="740" y="265" width="100" height="26" fill="#fff" stroke="#00838f"/><text x="790" y="283" text-anchor="middle">GND</text>
    <rect x="740" y="315" width="100" height="26" fill="#fff" stroke="#00838f"/><text x="790" y="333" text-anchor="middle">D8 (RX)</text>
    <rect x="740" y="365" width="100" height="26" fill="#fff" stroke="#00838f"/><text x="790" y="383" text-anchor="middle">D9 (TX)</text>
    <rect x="740" y="440" width="100" height="26" fill="#fff" stroke="#00838f"/><text x="790" y="458" text-anchor="middle">A0</text>
    <rect x="900" y="440" width="100" height="26" fill="#fff" stroke="#00838f"/><text x="950" y="458" text-anchor="middle">GND</text>
  </g>

  <!-- ===== Cables ===== -->
  <g fill="none" stroke-width="3">
    <!-- 3V3 → LV -->
    <path d="M300 178 H360 V228 H420" stroke="#f57c00"/>
    <!-- 5V → HV y Arduino 5V -->
    <path d="M300 228 H340 V130 H680 V228 H620" stroke="#d32f2f"/>
    <path d="M680 228 H740" stroke="#d32f2f"/>
    <!-- GND -->
    <path d="M300 278 H420" stroke="#212121"/>
    <path d="M620 278 H740" stroke="#212121"/>
    <!-- TX Pi → LV1 → HV1 → D8 -->
    <path d="M300 328 H420" stroke="#7b1fa2"/>
    <path d="M620 328 H740" stroke="#7b1fa2"/>
    <!-- RX Pi ← LV2 ← HV2 ← D9 -->
    <path d="M300 378 H420" stroke="#00897b"/>
    <path d="M620 378 H740" stroke="#00897b"/>
  </g>
  <g font-size="11" fill="#444">
    <text x="345" y="122">5 V</text>
    <text x="306" y="320">Pi TX → Ard. RX</text>
    <text x="640" y="322">→</text>
    <text x="306" y="396">Pi RX ← Ard. TX</text>
    <text x="640" y="396">←</text>
  </g>

  <!-- ===== Piranómetro ===== -->
  <rect x="380" y="520" width="690" height="180" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="400" y="545" font-size="15" font-weight="bold" fill="#e65100">Piranómetro casero (Hackster · Jeffrey)</text>
  <!-- celda -->
  <rect x="420" y="575" width="120" height="80" fill="#1a237e" stroke="#000"/>
  <g stroke="#5c6bc0" stroke-width="1"><line x1="460" y1="575" x2="460" y2="655"/><line x1="500" y1="575" x2="500" y2="655"/><line x1="420" y1="602" x2="540" y2="602"/><line x1="420" y1="628" x2="540" y2="628"/></g>
  <text x="480" y="673" text-anchor="middle" font-size="12">celda solar (60 × 20 mm)</text>
  <text x="550" y="576" font-size="13" fill="#d32f2f" font-weight="bold">+</text>
  <text x="548" y="642" font-size="15" font-weight="bold">−</text>
  <!-- R serie -->
  <rect x="640" y="575" width="60" height="14" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="670" y="568" text-anchor="middle" font-size="12" font-weight="bold">R 10 kΩ (en serie)</text>
  <g fill="none" stroke-width="3">
    <path d="M540 582 H640" stroke="#d32f2f"/>
    <path d="M700 582 H790 V466" stroke="#f57c00"/>
    <path d="M540 648 H950 V466" stroke="#212121"/>
  </g>
  <text x="820" y="600" font-size="11" fill="#444">celda ≤ 5 V en A0</text>
  <text x="600" y="680" font-size="12" fill="#444">P = V² / R  ·  A = largo × ancho  ·  G = P / A × CAL_K  [W/m²]</text>
  <!-- notas -->
  <g font-size="12" fill="#333">
    <text x="30" y="530" font-weight="bold">Notas</text>
    <text x="30" y="550">• GND común entre Pi, conversor y Arduino.</text>
    <text x="30" y="570">• Nunca unir TX/RX de la Pi directo al</text>
    <text x="42" y="586">Arduino: la Pi es de 3,3 V.</text>
    <text x="30" y="606">• Al programar el Arduino por USB,</text>
    <text x="42" y="622">desconectar el cable de 5 V de la Pi.</text>
    <text x="30" y="642">• La celda nunca debe superar 5 V</text>
    <text x="42" y="658">(medir con multímetro a pleno sol).</text>
  </g>
</svg>
