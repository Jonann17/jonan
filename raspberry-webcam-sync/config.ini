# ============================================================
#  Configuración compartida del sistema de webcam
#  Editá este archivo en cada Raspberry según su rol.
# ============================================================

[general]
# Número de padrón. Es el identificador que se usa como prefijo
# en el nombre de cada foto: padron<PADRON>_DDMMAAAA_HHMMSS.jpg
padron = 0001

[camara]
# Cada cuántos segundos se saca una foto (600 = 10 minutos)
intervalo_segundos = 600

# Dispositivo de la webcam USB (normalmente /dev/video0)
dispositivo = /dev/video0

# Resolución de la foto. Formato 4:3 para aprovechar mejor la lente fisheye
# (captura más zona que 16:9). Podés subirla al máximo 4:3 que soporte tu
# webcam: 1600x1200, 2048x1536, etc. (ver: v4l2-ctl --list-formats-ext -d /dev/video0)
resolucion = 1280x960

# Resolución del "Ver en vivo" (más baja = más fluido). La usa el servidor.
resolucion_vivo = 640x480

# Carpeta local donde el Pi de la cámara guarda SUS fotos (su "nube" local)
carpeta_local = /home/pi/fotos_camara

# URL del servidor web al que se suben las fotos.
# En este proyecto la cámara y el servidor están en el MISMO Pi, así que la
# cámara sube por localhost (no depende del WiFi, es lo más robusto).
url_servidor = http://127.0.0.1:8000

[servidor]
# Puerto donde escucha el servidor web
puerto = 8000

# Carpeta donde el servidor guarda todas las fotos recibidas (la "nube")
carpeta_nube = /home/pi/nube_fotos

[descargador]
# URL del servidor desde donde se descargan las fotos.
# El descargador es OTRO Pi que se conecta al hotspot del Pi cámara/servidor,
# así que usa la IP fija del hotspot:
url_servidor = http://192.168.50.1:8000

# Cada cuántos segundos revisa si hay fotos nuevas para descargar
intervalo_segundos = 300

# Carpeta local del segundo Pi donde se guardan las fotos descargadas
carpeta_local = /home/pi/fotos_descargadas
